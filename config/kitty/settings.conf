# https://sw.kovidgoyal.net/kitty/conf/
# reload: ctrl + cmd + ,
# debug: opt + cmd + ,

# ── Fonts ─────────────────────────────────────────────────────────────
# `kitten choose-fonts`

# font_family JetBrainsMono Nerd Font Mono
# # https://github.com/JetBrains/JetBrainsMono#opentype-features
# font_features JetBrainsMonoNFM-Regular +cv11 +cv12 +cv18
# font_features JetBrainsMonoNFM-SemiBold +cv11 +cv12 +cv18
# font_features JetBrainsMonoNFM-Italic +cv12 +cv16 +cv18 +cv19 +cv20
# font_features JetBrainsMonoNFM-SemiBoldItalic +ss02 +cv12 +cv16 +cv18 +cv19 +cv20
# modify_font cell_height 110%

font_family Maple Mono NF CN
# https://font.subf.dev/en/playground/
# cv01: Remove gaps
# ss05: Thin escape backslash
font_features MapleMono-NF-CN-Regular +cv01 +ss05
font_features MapleMono-NF-CN-SemiBold +cv01 +ss05
font_features MapleMono-NF-CN-Italic +cv01 +ss05
font_features MapleMono-NF-CN-SemiBoldItalic +cv01 +ss05

# Force to use Symbols Nerd Font for Nerd Font symbols
symbol_map             U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6AA,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+F8FF,U+F0001-U+F1AF0 Symbols Nerd Font Mono

font_size 16
disable_ligatures cursor

# ── Text cursor customization ─────────────────────────────────────────
cursor_trail 20
cursor_trail_decay 0.0 0.3
cursor_trail_start_threshold 10

# ── Scrollback ────────────────────────────────────────────────────────

# ── Mouse ─────────────────────────────────────────────────────────────
copy_on_select true

# ── Performance tuning ────────────────────────────────────────────────
sync_to_monitor no

# ── Terminal bell ─────────────────────────────────────────────────────

# ── Window layout ─────────────────────────────────────────────────────
remember_window_position true
enabled_layouts splits,stack
hide_window_decorations titlebar-only

# ── Tab bar ───────────────────────────────────────────────────────────
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style angled
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title}{' ' if layout_name == 'stack' else ''}"

# ── Color scheme ──────────────────────────────────────────────────────
background_opacity 1
background_blur 0
# ctrl + shift + a > m(ore)/l(ell)/1(full)/r(eset)
dynamic_background_opacity yes

# ── Advanced ──────────────────────────────────────────────────────────
allow_remote_control true

# ── OS specific tweaks ────────────────────────────────────────────────
macos_option_as_alt both

